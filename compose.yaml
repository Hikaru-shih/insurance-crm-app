services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set PostgreSQL DATABASE_URL}
      ALLOW_REGISTRATION: "0"
      ALLOWED_ORIGINS: https://${DOMAIN:?Set DOMAIN}
      PUBLIC_APP_URL: https://${DOMAIN}
      MAIL_MODE: resend
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
